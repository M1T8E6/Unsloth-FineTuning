[project]
name = "unsloth-finetuning"
version = "0.1.0"
description = "Fine-tuning Llama 3.2 models using Unsloth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "black",
    "ipykernel",
    "peft",
    "plotly",
    "pylint",
    "python-dotenv",
    "torch",
    "torchaudio",
    "torchvision",
    "transformers",
    "trl",
    "unsloth",
    "xformers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Fix for xformers build dependency
extra-build-dependencies = { xformers = ["torch"] }